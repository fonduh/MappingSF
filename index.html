<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>3D San Francisco – Overture Maps Demo</title>

  <!-- MapLibre GL & PMTiles -->
  <link  href="https://unpkg.com/maplibre-gl@^4.0/dist/maplibre-gl.css" rel="stylesheet"/>
  <script src="https://unpkg.com/maplibre-gl@^4.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@^3.1/dist/pmtiles.js"></script>

  <style>
    html,body,#map{margin:0;height:100%;width:100%}
    #yearSlider{
      position:absolute;left:10px;bottom:15px;z-index:1;
      background:#fff;padding:6px 10px;border-radius:4px;
      font:14px/1.3 sans-serif;box-shadow:0 1px 4px rgba(0,0,0,.2)}
    #info{margin-top:4px;font-size:12px;text-align:center}
  </style>
</head>
<body>
<div id="map"></div>

<!-- Year filter UI -->
<div id="yearSlider">
  <label>Show buildings built ≤ <span id="yearOut">2025</span>
    <input id="slider" type="range" min="1850" max="2025" step="5" value="2025">
  </label>
  <div id="info">Drag to time‑travel</div>
</div>

<script>
/* ---------- 1. Basemap --------------------------------------------------- */
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://demotiles.maplibre.org/style.json',
  center: [-122.4194, 37.7749],
  zoom: 13,
  pitch: 60,
  bearing: -40
});
map.addControl(new maplibregl.NavigationControl());

/* ---------- 2. Register the pmtiles:// protocol -------------------------- */
const protocol = new pmtiles.Protocol();
maplibregl.addProtocol('pmtiles', protocol.tile);

/* ---------- 3. Add Overture sources once style loads -------------------- */
map.on('load', () => {

  /* --- 3a. Buildings ---------------------------------------------------- */
  map.addSource('overture-buildings', {
    type: 'vector',
    url: 'pmtiles://https://overturemaps-tiles-us-west-2-beta.s3.amazonaws.com/2025-06-25/buildings.pmtiles',
    minzoom: 6, maxzoom: 15
  });

  map.addLayer({
    id: 'buildings-3d',
    type: 'fill-extrusion',
    source: 'overture-buildings',
    'source-layer': 'buildings',
    paint: {
      /* Height in metres – fall back to 10 m if missing */
      'fill-extrusion-height': ['coalesce', ['get', 'height'], 10],
      /* Light colour ramp by construction year  */
      'fill-extrusion-color': [
        'interpolate', ['linear'], ['get', 'year_built'],
        1850, '#cbb0a3',
        1900, '#bfa67e',
        1950, '#8daaa7',
        2000, '#5c8fb3',
        2025, '#375e9d'
      ],
      'fill-extrusion-opacity': 0.9
    }
  });

  /* --- 3b. Roads -------------------------------------------------------- */
  map.addSource('overture-roads', {
    type: 'vector',
    url: 'pmtiles://https://overturemaps-tiles-us-west-2-beta.s3.amazonaws.com/2025-06-25/transportation.pmtiles',
    minzoom: 6, maxzoom: 15
  });
  map.addLayer({
    id: 'roads',
    type: 'line',
    source: 'overture-roads',
    'source-layer': 'roads',          // MVT layer name
    paint: {
      'line-width': [
        'interpolate', ['linear'], ['zoom'],
        10, 0.2, 14, 1.2, 18, 4
      ],
      'line-color': '#a7bfd7'
    }
  });

  /* --- 3c. Places (POIs) ------------------------------------------------ */
  map.addSource('overture-places', {
    type: 'vector',
    url: 'pmtiles://https://overturemaps-tiles-us-west-2-beta.s3.amazonaws.com/2025-06-25/places.pmtiles',
    minzoom: 10, maxzoom: 15
  });
  map.addLayer({
    id: 'places',
    type: 'symbol',
    source: 'overture-places',
    'source-layer': 'places',
    layout: {
      'icon-image': 'marker-15',
      'icon-size': 0.8,
      'text-field': ['get', 'name'],
      'text-offset': [0, 1.2],
      'text-anchor': 'top',
      'text-size': 11,
      'text-optional': true
    },
    paint: {
      'text-color': '#00334e',
      'text-halo-color': '#ffffff',
      'text-halo-width': 1
    }
  });

  /* --- 4. Pop‑ups ------------------------------------------------------- */
  map.on('click', 'buildings-3d', (e) => {
    const p = e.features[0].properties;
    new maplibregl.Popup()
      .setLngLat(e.lngLat)
      .setHTML(`<b>Building</b><hr>
                Height: ${p.height || 'n/a'} m<br>
                Year built: ${p.year_built || 'n/a'}<br>
                Levels: ${p.level || 'n/a'}`)
      .addTo(map);
  });
  map.on('click', 'places', (e) => {
    const p = e.features[0].properties;
    new maplibregl.Popup()
      .setLngLat(e.lngLat)
      .setHTML(`<b>${p.name || 'Place'}</b><br>
                Category: ${p.category || 'n/a'}`)
      .addTo(map);
  });

  map.on('mouseenter', 'places', () => map.getCanvas().style.cursor = 'pointer');
  map.on('mouseleave', 'places', () => map.getCanvas().style.cursor = '');

});

/* ---------- 5. Year filter slider --------------------------------------- */
const slider = document.getElementById('slider');
const yearOut = document.getElementById('yearOut');
slider.addEventListener('input', () => {
  yearOut.textContent = slider.value;
  /* Filter buildings whose year_built <= selected value or year missing */
  map.setFilter('buildings-3d', [
    'all',
    ['<=', ['coalesce', ['get', 'year_built'], 0], Number(slider.value)]
  ]);
});
</script>
</body>
</html>
